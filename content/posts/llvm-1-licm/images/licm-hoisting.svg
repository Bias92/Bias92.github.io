<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">LICM before and after hoisting</title>
  <desc id="desc">The control-flow graph stays the same while multiplication and addition move from for.body to the entry preheader.</desc>

  <defs>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46d9ff"/>
    </marker>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ed72d9"/>
    </marker>
    <style>
      .panel-title { fill: #f2f5f7; font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; }
      .block { fill: #14171b; stroke: #8c949d; stroke-width: 1.5; }
      .block-name { fill: #f2f5f7; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .block-role { fill: #8c949d; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .code { fill: #8c949d; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .moved { fill: #ed72d9; font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow { fill: none; stroke: #46d9ff; stroke-width: 1.8; marker-end: url(#arrow-cyan); }
      .hoist { fill: none; stroke: #ed72d9; stroke-width: 2.2; stroke-dasharray: 5 5; marker-end: url(#arrow-magenta); }
    </style>
  </defs>

  <rect width="720" height="400" fill="#0d0e10"/>
  <line x1="360" y1="18" x2="360" y2="382" stroke="#252a30" stroke-width="1"/>

  <text class="panel-title" x="180" y="25" text-anchor="middle">BEFORE LICM</text>
  <text class="panel-title" x="540" y="25" text-anchor="middle">AFTER LICM</text>

  <g aria-label="before LICM control-flow graph">
    <rect class="block" x="100" y="45" width="160" height="64" rx="8"/>
    <text class="block-name" x="180" y="68" text-anchor="middle">entry</text>
    <text class="block-role" x="180" y="89" text-anchor="middle">preheader</text>

    <rect class="block" x="100" y="135" width="160" height="50" rx="8"/>
    <text class="block-name" x="180" y="157" text-anchor="middle">for.cond</text>
    <text class="code" x="180" y="175" text-anchor="middle">phi · icmp · br</text>

    <rect class="block" x="100" y="215" width="160" height="76" rx="8"/>
    <text class="block-name" x="180" y="237" text-anchor="middle">for.body</text>
    <text class="moved" x="180" y="257" text-anchor="middle" filter="url(#bloom)">%mul · %add</text>
    <text class="code" x="180" y="277" text-anchor="middle">load · %mul1 · store</text>

    <rect class="block" x="100" y="320" width="160" height="50" rx="8"/>
    <text class="block-name" x="180" y="342" text-anchor="middle">for.inc</text>
    <text class="code" x="180" y="360" text-anchor="middle">add · br</text>

    <rect class="block" x="275" y="135" width="70" height="50" rx="8"/>
    <text class="block-name" x="310" y="157" text-anchor="middle">for.end</text>
    <text class="code" x="310" y="175" text-anchor="middle">ret</text>

    <path class="flow" d="M180 109 V135"/>
    <path class="flow" d="M180 185 V215"/>
    <path class="flow" d="M260 160 H275"/>
    <path class="flow" d="M180 291 V320"/>
    <path class="flow" d="M180 370 V385 H75 V160 H100"/>
  </g>

  <g aria-label="after LICM control-flow graph">
    <rect class="block" x="460" y="45" width="160" height="64" rx="8"/>
    <text class="block-name" x="540" y="64" text-anchor="middle">entry</text>
    <text class="moved" x="540" y="83" text-anchor="middle" filter="url(#bloom)">%mul · %add</text>
    <text class="block-role" x="540" y="100" text-anchor="middle">preheader</text>

    <rect class="block" x="460" y="135" width="160" height="50" rx="8"/>
    <text class="block-name" x="540" y="157" text-anchor="middle">for.cond</text>
    <text class="code" x="540" y="175" text-anchor="middle">phi · icmp · br</text>

    <rect class="block" x="460" y="215" width="160" height="76" rx="8"/>
    <text class="block-name" x="540" y="237" text-anchor="middle">for.body</text>
    <text class="code" x="540" y="263" text-anchor="middle">load · %mul1 · store</text>

    <rect class="block" x="460" y="320" width="160" height="50" rx="8"/>
    <text class="block-name" x="540" y="342" text-anchor="middle">for.inc</text>
    <text class="code" x="540" y="360" text-anchor="middle">add · br</text>

    <rect class="block" x="635" y="135" width="70" height="50" rx="8"/>
    <text class="block-name" x="670" y="157" text-anchor="middle">for.end</text>
    <text class="code" x="670" y="175" text-anchor="middle">ret</text>

    <path class="flow" d="M540 109 V135"/>
    <path class="flow" d="M540 185 V215"/>
    <path class="flow" d="M620 160 H635"/>
    <path class="flow" d="M540 291 V320"/>
    <path class="flow" d="M540 370 V385 H435 V160 H460"/>
  </g>

  <path class="hoist" d="M260 253 C325 304 394 29 460 78" filter="url(#bloom)"/>
  <text class="moved" x="364" y="111" text-anchor="middle">hoist</text>
</svg>
