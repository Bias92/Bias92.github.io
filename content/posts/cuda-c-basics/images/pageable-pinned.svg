<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Pageable memory and pinned memory copy paths</title>
  <desc>Pageable host memory uses an intermediate staging buffer before reaching GPU memory. Pinned host memory copies directly to GPU memory.</desc>
  <style>
    text{font-family:'Roboto','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
    .heading{font-size:16px;font-weight:700;letter-spacing:.08em;fill:#d5d8dc}
    .label{font-size:13px;font-weight:650;letter-spacing:.04em;fill:#edf4f7}
  </style>

  <defs>
    <linearGradient id="gray-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30373c"/>
      <stop offset="1" stop-color="#737f86"/>
    </linearGradient>
    <linearGradient id="cyan-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19576a"/>
      <stop offset="1" stop-color="#39c5e7"/>
    </linearGradient>

    <filter id="gray-halo-wide" x="-80" y="-80" width="880" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="gray-halo-near" x="-80" y="-80" width="880" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="cyan-halo-wide" x="-80" y="-80" width="880" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="cyan-halo-near" x="-80" y="-80" width="880" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#9aa6ad"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#46d9ff"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#0d0e10"/>
  <line x1="360" y1="28" x2="360" y2="312" stroke="#1e252b" stroke-width="1"/>

  <text x="180" y="42" class="heading" text-anchor="middle">PAGEABLE</text>
  <text x="540" y="42" class="heading" text-anchor="middle">PINNED</text>

  <!-- pageable: CPU buffer -> staging -> GPU memory -->
  <g fill="#a4b1b8" opacity=".10" filter="url(#gray-halo-wide)">
    <rect x="77" y="68" width="206" height="48" rx="24"/>
    <rect x="77" y="158" width="206" height="48" rx="24"/>
  </g>
  <g fill="none" stroke="#a4b1b8" stroke-width="3" opacity=".58" filter="url(#gray-halo-near)">
    <rect x="77" y="68" width="206" height="48" rx="24"/>
    <rect x="77" y="158" width="206" height="48" rx="24"/>
  </g>
  <g fill="url(#gray-fill)" stroke="#a4b1b8" stroke-width="1.4">
    <rect x="77" y="68" width="206" height="48" rx="24"/>
    <rect x="77" y="158" width="206" height="48" rx="24"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="180" y="97">CPU BUFFER</text>
    <text x="180" y="187">TEMP PINNED</text>
  </g>

  <g stroke="#9aa6ad" stroke-width="2" fill="none" marker-end="url(#arrow-gray)">
    <line x1="180" y1="121" x2="180" y2="151"/>
    <line x1="180" y1="211" x2="180" y2="241"/>
  </g>

  <!-- pinned: direct host-to-device copy -->
  <g fill="#46d9ff" opacity=".14" filter="url(#cyan-halo-wide)">
    <rect x="77" y="248" width="206" height="48" rx="24"/>
    <rect x="437" y="68" width="206" height="48" rx="24"/>
    <rect x="437" y="248" width="206" height="48" rx="24"/>
  </g>
  <g fill="none" stroke="#46d9ff" stroke-width="3" opacity=".78" filter="url(#cyan-halo-near)">
    <rect x="77" y="248" width="206" height="48" rx="24"/>
    <rect x="437" y="68" width="206" height="48" rx="24"/>
    <rect x="437" y="248" width="206" height="48" rx="24"/>
  </g>
  <g fill="url(#cyan-fill)" stroke="#46d9ff" stroke-width="1.6">
    <rect x="77" y="248" width="206" height="48" rx="24"/>
    <rect x="437" y="68" width="206" height="48" rx="24"/>
    <rect x="437" y="248" width="206" height="48" rx="24"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="180" y="277">GPU MEMORY</text>
    <text x="540" y="97">PINNED BUFFER</text>
    <text x="540" y="277">GPU MEMORY</text>
  </g>

  <line x1="540" y1="122" x2="540" y2="240" stroke="#46d9ff" stroke-width="8" opacity=".10" filter="url(#cyan-halo-wide)"/>
  <line x1="540" y1="122" x2="540" y2="240" stroke="#46d9ff" stroke-width="3" opacity=".60" filter="url(#cyan-halo-near)"/>
  <line x1="540" y1="121" x2="540" y2="241" stroke="#46d9ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
</svg>
