    <text x="224" y="85">L8</text><text x="240" y="85">L9</text><text x="256" y="85">L10</text><text x="272" y="85">L11</text>
    <text x="288" y="85">L12</text><text x="304" y="85">L13</text><text x="320" y="85">L14</text><text x="336" y="85">L15</text>
    <text x="369" y="85">L16</text><text x="385" y="85">L17</text><text x="401" y="85">L18</text><text x="417" y="85">L19</text>
    <text x="433" y="85">L20</text><text x="449" y="85">L21</text><text x="465" y="85">L22</text><text x="481" y="85">L23</text>
    <text x="514" y="85">L24</text><text x="530" y="85">L25</text><text x="546" y="85">L26</text><text x="562" y="85">L27</text>
    <text x="578" y="85">L28</text><text x="594" y="85">L29</text><text x="610" y="85">L30</text><text x="626" y="85">L31</text>
