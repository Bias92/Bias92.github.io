    <rect x="213" y="210" width="134" height="54" rx="27"/>
    <rect x="358" y="210" width="134" height="54" rx="27"/>
    <rect x="503" y="210" width="134" height="54" rx="27"/>
  </g>
  <g fill="url(#sector-fill)" stroke="#46d9ff" stroke-width="1.5">
    <rect x="68" y="210" width="134" height="54" rx="27"/>
    <rect x="213" y="210" width="134" height="54" rx="27"/>
    <rect x="358" y="210" width="134" height="54" rx="27"/>
    <rect x="503" y="210" width="134" height="54" rx="27"/>
