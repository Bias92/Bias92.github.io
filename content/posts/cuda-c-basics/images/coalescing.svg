    <rect x="539" y="68" width="14" height="30" rx="4"/><rect x="555" y="68" width="14" height="30" rx="4"/>
    <rect x="571" y="68" width="14" height="30" rx="4"/><rect x="587" y="68" width="14" height="30" rx="4"/>
    <rect x="603" y="68" width="14" height="30" rx="4"/><rect x="619" y="68" width="14" height="30" rx="4"/>
  </g>

