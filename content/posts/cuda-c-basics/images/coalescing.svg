<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Coalesced access from 32 warp lanes to four memory sectors</title>
  <desc>Thirty-two neighboring warp lanes access consecutive addresses. Each group of eight four-byte accesses is combined into one 32-byte memory sector.</desc>
  <style>
    text{font-family:'Roboto','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif}
    .lane-label{fill:#eef3f5;font-size:6.5px;font-weight:650;text-anchor:middle}
    .sector-label{fill:#eef3f5;font-size:13px;font-weight:650;text-anchor:middle;letter-spacing:.04em}
  </style>
  <defs>
    <linearGradient id="lane-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35142f"/>
      <stop offset="1" stop-color="#a84498"/>
    </linearGradient>
    <linearGradient id="sector-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173a45"/>
      <stop offset="1" stop-color="#31badb"/>
    </linearGradient>
    <filter id="magenta-wide" x="-60" y="-60" width="840" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="magenta-near" x="-60" y="-60" width="840" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="cyan-wide" x="-60" y="-60" width="840" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="cyan-near" x="-60" y="-60" width="840" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <rect width="720" height="340" fill="#0d0e10"/>

  <g stroke="#1e252b" stroke-width="1">
    <line x1="68" y1="42" x2="68" y2="292"/>
    <line x1="202" y1="42" x2="202" y2="292"/>
    <line x1="213" y1="42" x2="213" y2="292"/>
    <line x1="347" y1="42" x2="347" y2="292"/>
    <line x1="358" y1="42" x2="358" y2="292"/>
    <line x1="492" y1="42" x2="492" y2="292"/>
    <line x1="503" y1="42" x2="503" y2="292"/>
    <line x1="637" y1="42" x2="637" y2="292"/>
  </g>

  <g fill="#d95cc5" opacity="0.12" filter="url(#magenta-wide)">
    <rect x="68" y="64" width="134" height="38" rx="8"/>
    <rect x="213" y="64" width="134" height="38" rx="8"/>
    <rect x="358" y="64" width="134" height="38" rx="8"/>
    <rect x="503" y="64" width="134" height="38" rx="8"/>
  </g>
  <g fill="none" stroke="#ed72d9" stroke-width="2.2" opacity="0.62" filter="url(#magenta-near)">
    <rect x="68" y="64" width="134" height="38" rx="8"/>
    <rect x="213" y="64" width="134" height="38" rx="8"/>
    <rect x="358" y="64" width="134" height="38" rx="8"/>
    <rect x="503" y="64" width="134" height="38" rx="8"/>
