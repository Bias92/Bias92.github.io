  <g stroke="#66727a" stroke-width="1" opacity="0.58">
    <path d="M79 108L135 202M95 108L135 202M111 108L135 202M127 108L135 202M143 108L135 202M159 108L135 202M175 108L135 202M191 108L135 202"/>
    <path d="M224 108L280 202M240 108L280 202M256 108L280 202M272 108L280 202M288 108L280 202M304 108L280 202M320 108L280 202M336 108L280 202"/>
    <path d="M369 108L425 202M385 108L425 202M401 108L425 202M417 108L425 202M433 108L425 202M449 108L425 202M465 108L425 202M481 108L425 202"/>
    <path d="M514 108L570 202M530 108L570 202M546 108L570 202M562 108L570 202M578 108L570 202M594 108L570 202M610 108L570 202M626 108L570 202"/>
  </g>

