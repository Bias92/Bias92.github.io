<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif">
<rect width="680" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="60" y="52" font-size="14" font-weight="500" fill="#222">일반 불연속점 t₁</text>
<line x1="60" y1="200" x2="310" y2="200" stroke="#8A8A8A" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="80" y1="215" x2="80" y2="60" stroke="#8A8A8A" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="300" y="220" font-size="12" fill="#555">t</text>
<text x="66" y="66" font-size="12" fill="#555">x(t)</text>
<path d="M85 165 Q140 160 190 150" fill="none" stroke="#7C5CBF" stroke-width="1.5"/>
<path d="M190 100 Q240 95 300 90" fill="none" stroke="#7C5CBF" stroke-width="1.5"/>
<circle cx="190" cy="150" r="4" fill="#ffffff" stroke="#7C5CBF" stroke-width="1.5"/>
<circle cx="190" cy="100" r="4" fill="#ffffff" stroke="#7C5CBF" stroke-width="1.5"/>
<circle cx="190" cy="125" r="4" fill="#7C5CBF"/>
<line x1="190" y1="200" x2="190" y2="205" stroke="#8A8A8A" stroke-width="0.8"/>
<text x="184" y="220" font-size="12" fill="#555">t₁</text>
<line x1="80" y1="150" x2="190" y2="150" stroke="#8A8A8A" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="80" y1="100" x2="190" y2="100" stroke="#8A8A8A" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="60" y="154" font-size="12" fill="#555">a</text>
<text x="60" y="104" font-size="12" fill="#555">b</text>
<text x="200" y="154" font-size="12" fill="#555">x(t₁⁻) = a</text>
<text x="200" y="104" font-size="12" fill="#555">x(t₁⁺) = b</text>
<text x="200" y="129" font-size="12" fill="#555">x(t₁) = (a + b)/2</text>
<text x="380" y="52" font-size="14" font-weight="500" fill="#222">단위계단함수 u(t)</text>
<line x1="380" y1="200" x2="640" y2="200" stroke="#8A8A8A" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="490" y1="215" x2="490" y2="60" stroke="#8A8A8A" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="630" y="220" font-size="12" fill="#555">t</text>
<text x="496" y="66" font-size="12" fill="#555">u(t)</text>
<line x1="390" y1="200" x2="490" y2="200" stroke="#1F8A7A" stroke-width="2"/>
<line x1="490" y1="100" x2="630" y2="100" stroke="#1F8A7A" stroke-width="2"/>
<circle cx="490" cy="200" r="4" fill="#ffffff" stroke="#1F8A7A" stroke-width="1.5"/>
<circle cx="490" cy="100" r="4" fill="#ffffff" stroke="#1F8A7A" stroke-width="1.5"/>
<circle cx="490" cy="150" r="4" fill="#1F8A7A"/>
<line x1="490" y1="100" x2="490" y2="200" stroke="#1F8A7A" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="470" y="104" font-size="12" fill="#555">1</text>
<text x="470" y="154" font-size="12" fill="#555">½</text>
<text x="480" y="220" font-size="12" fill="#555">0</text>
<text x="500" y="154" font-size="12" fill="#555">u(0) = ½</text>
<text x="400" y="190" font-size="12" fill="#555">t &lt; 0: 0</text>
<text x="560" y="90" font-size="12" fill="#555">t &gt; 0: 1</text>
</svg>
