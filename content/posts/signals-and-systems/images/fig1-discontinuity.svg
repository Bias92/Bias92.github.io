<svg width="720" height="270" viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="disc-cyan-glow" x="-50%" y="-140%" width="200%" height="380%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide"/>
      <feComponentTransfer in="wide" result="wide-soft"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/>
      <feComponentTransfer in="near" result="near-soft"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="wide-soft"/><feMergeNode in="near-soft"/></feMerge>
    </filter>
    <filter id="disc-magenta-glow" x="-220%" y="-220%" width="540%" height="540%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide"/>
      <feComponentTransfer in="wide" result="wide-soft"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/>
      <feComponentTransfer in="near" result="near-soft"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="wide-soft"/><feMergeNode in="near-soft"/></feMerge>
    </filter>
    <marker id="disc-grey-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8c949d"/></marker>

    <g id="disc-curves-a">
      <path d="M85 165 Q140 160 190 150" fill="none" stroke="#46d9ff" stroke-width="1.8"/>
      <path d="M190 100 Q240 95 305 90" fill="none" stroke="#46d9ff" stroke-width="1.8"/>
    </g>
    <g id="disc-curves-b">
      <line x1="430" y1="200" x2="530" y2="200" stroke="#46d9ff" stroke-width="2.2"/>
      <line x1="530" y1="100" x2="670" y2="100" stroke="#46d9ff" stroke-width="2.2"/>
    </g>
    <g id="disc-dots">
      <circle cx="190" cy="125" r="4.5" fill="#ed72d9"/>
      <circle cx="530" cy="150" r="4.5" fill="#ed72d9"/>
    </g>
  </defs>

  <rect x="0" y="0" width="720" height="270" rx="12" fill="#0d0e10" stroke="#22323a"/>

  <!-- left: general discontinuity at t1 -->
  <text x="60" y="44" font-size="14" fill="#dbeef4" font-weight="600">x(t) at t₁</text>
  <line x1="60" y1="200" x2="330" y2="200" stroke="#8c949d" stroke-width="1" marker-end="url(#disc-grey-arrow)"/>
  <line x1="80" y1="215" x2="80" y2="60" stroke="#8c949d" stroke-width="1" marker-end="url(#disc-grey-arrow)"/>
  <text x="322" y="222" font-size="12" fill="#8c949d">t</text>
  <text x="86" y="66" font-size="12" fill="#8c949d">x(t)</text>
  <line x1="80" y1="150" x2="190" y2="150" stroke="#8c949d" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="80" y1="100" x2="190" y2="100" stroke="#8c949d" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="190" y1="200" x2="190" y2="205" stroke="#8c949d" stroke-width="1"/>
  <use xlink:href="#disc-curves-a" filter="url(#disc-cyan-glow)"/>
  <use xlink:href="#disc-curves-a"/>
  <circle cx="190" cy="150" r="4.5" fill="#0d0e10" stroke="#46d9ff" stroke-width="1.6"/>
  <circle cx="190" cy="100" r="4.5" fill="#0d0e10" stroke="#46d9ff" stroke-width="1.6"/>
  <text x="184" y="222" font-size="12" fill="#8c949d">t₁</text>
  <text x="62" y="154" font-size="12" fill="#8c949d">a</text>
  <text x="62" y="104" font-size="12" fill="#8c949d">b</text>
  <text x="200" y="154" font-size="12" fill="#46d9ff">x(t₁⁻) = a</text>
  <text x="200" y="104" font-size="12" fill="#46d9ff">x(t₁⁺) = b</text>
  <text x="200" y="129" font-size="12" fill="#ed72d9">x(t₁) =</text><text x="272.0" y="122.0" font-size="11" fill="#ed72d9" text-anchor="middle">a + b</text><line x1="255.0" y1="125.0" x2="289.0" y2="125.0" stroke="#ed72d9" stroke-width="0.9"/><text x="272.0" y="136.0" font-size="11" fill="#ed72d9" text-anchor="middle">2</text>

  <!-- right: unit step -->
  <text x="420" y="44" font-size="14" fill="#dbeef4" font-weight="600">u(t)</text>
  <line x1="420" y1="200" x2="680" y2="200" stroke="#8c949d" stroke-width="1" marker-end="url(#disc-grey-arrow)"/>
  <line x1="530" y1="215" x2="530" y2="60" stroke="#8c949d" stroke-width="1" marker-end="url(#disc-grey-arrow)"/>
  <text x="672" y="222" font-size="12" fill="#8c949d">t</text>
  <text x="536" y="66" font-size="12" fill="#8c949d">u(t)</text>
  <line x1="530" y1="100" x2="530" y2="200" stroke="#8c949d" stroke-width="0.8" stroke-dasharray="3 3"/>
  <use xlink:href="#disc-curves-b" filter="url(#disc-cyan-glow)"/>
  <use xlink:href="#disc-curves-b"/>
  <circle cx="530" cy="200" r="4.5" fill="#0d0e10" stroke="#46d9ff" stroke-width="1.6"/>
  <circle cx="530" cy="100" r="4.5" fill="#0d0e10" stroke="#46d9ff" stroke-width="1.6"/>
  <text x="512" y="104" font-size="12" fill="#8c949d">1</text>
  <text x="512" y="154" font-size="12" fill="#8c949d">½</text>
  <text x="520" y="222" font-size="12" fill="#8c949d">0</text>
  <text x="540" y="154" font-size="12" fill="#ed72d9">u(0) = ½</text>

  <use xlink:href="#disc-dots" filter="url(#disc-magenta-glow)"/>
  <use xlink:href="#disc-dots"/>
</svg>
