<svg width="720" height="520" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LLVM compilation pipeline, hand-drawn</title>
  <desc>A handwritten-style note: Test.c flows down through clang, opt, llc, and clang again to become a.out. The opt stage is circled in red pen with the word hackable.</desc>
  <style>
    text{font-family:'Chalkboard SE','Comic Sans MS','Segoe Print','Bradley Hand',cursive;fill:#2b2b2b}
    .f{font-size:24px;letter-spacing:.02em}
    .tag{font-size:15px;fill:#8a8378}
    .cmd{font-size:17px;fill:#3a3a3a}
    .red{font-size:20px;fill:#c9372c}
  </style>

  <!-- paper -->
  <rect width="720" height="520" fill="#f6f2e8"/>
  <g stroke="#e5ddca" stroke-width="1">
    <line x1="0" y1="60"  x2="720" y2="60"/>
    <line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="180" x2="720" y2="180"/>
    <line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="300" x2="720" y2="300"/>
    <line x1="0" y1="360" x2="720" y2="360"/>
    <line x1="0" y1="420" x2="720" y2="420"/>
    <line x1="0" y1="480" x2="720" y2="480"/>
  </g>

  <!-- highlighter swipes -->
  <rect x="96" y="127" width="132" height="24" rx="10" fill="#ffdf3f" opacity="0.5" transform="rotate(-1.2 162 139)"/>
  <rect x="96" y="247" width="150" height="24" rx="10" fill="#ffdf3f" opacity="0.5" transform="rotate(0.8 170 259)"/>
  <rect x="96" y="447" width="110" height="24" rx="10" fill="#7fd8a4" opacity="0.45" transform="rotate(-0.9 150 459)"/>

  <!-- filenames + tags -->
  <text x="100" y="55"  class="f" transform="rotate(-0.6 100 55)">Test.c</text>
  <text x="260" y="53"  class="tag">// C source</text>

  <text x="100" y="146" class="f" transform="rotate(0.5 100 146)">Test.ll</text>
  <text x="260" y="144" class="tag">// IR</text>

  <text x="100" y="266" class="f" transform="rotate(-0.4 100 266)">Test.ll'</text>
  <text x="268" y="264" class="tag">// optimized IR</text>

  <text x="100" y="386" class="f" transform="rotate(0.6 100 386)">Test.s</text>
  <text x="256" y="384" class="tag">// assembly</text>

  <text x="100" y="466" class="f" transform="rotate(-0.5 100 466)">a.out</text>
  <text x="240" y="464" class="tag">// executable</text>

  <!-- wobbly down arrows -->
  <g fill="none" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round">
    <path d="M128 68 C 131 82, 126 98, 129 116"/>
    <path d="M123 108 L 129 118 L 134 109"/>
    <path d="M128 158 C 125 176, 131 196, 128 236"/>
    <path d="M122 228 L 128 238 L 134 229"/>
    <path d="M128 278 C 132 296, 125 316, 129 356"/>
    <path d="M123 348 L 129 358 L 134 349"/>
    <path d="M128 396 C 125 408, 131 420, 128 436"/>
    <path d="M122 428 L 128 438 L 133 429"/>
  </g>

  <!-- stage commands next to arrows -->
  <text x="160" y="98"  class="cmd" transform="rotate(-0.4 160 98)">clang : parse &#8594; AST &#8594; typecheck  (frontend)</text>
  <text x="160" y="204" class="cmd" transform="rotate(0.4 160 204)">opt : passes, IR &#8594; IR  (middle-end)</text>
  <text x="160" y="324" class="cmd" transform="rotate(-0.3 160 324)">llc : codegen  (backend)</text>
  <text x="160" y="422" class="cmd" transform="rotate(0.3 160 422)">clang : assemble + link</text>

  <!-- red pen circle around the opt stage -->
  <path d="M88 172 C 60 190, 66 236, 100 244 C 200 262, 420 258, 496 240 C 540 228, 534 190, 492 180 C 380 158, 170 160, 88 172 Z"
        fill="none" stroke="#c9372c" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <text x="530" y="196" class="red" transform="rotate(-2 530 196)">hackable!</text>
  <path d="M528 200 C 516 208, 508 214, 500 220" fill="none" stroke="#c9372c" stroke-width="2" stroke-linecap="round"/>
</svg>
