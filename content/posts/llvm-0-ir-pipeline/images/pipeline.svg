<svg width="720" height="130" viewBox="0 0 720 130" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LLVM compilation pipeline</title>
  <desc>Test.c is compiled to Test.ll by clang -emit-llvm -S, transformed by opt, lowered to Test.s by llc, and assembled and linked into a.out by clang.</desc>
  <style>
    text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#dff0f7}
    .cmd{font-size:11px;fill:#9fdcec}
    .file{font-size:13px}
    .tag{font-size:10.5px;fill:#6f8b96;font-family:'Roboto','Noto Sans KR',-apple-system,sans-serif}
  </style>

  <rect width="720" height="130" fill="#0d0e10"/>

  <text x="139" y="38" class="cmd" text-anchor="middle">clang -emit-llvm -S</text>
  <text x="286" y="38" class="cmd" text-anchor="middle">opt</text>
  <text x="433" y="38" class="cmd" text-anchor="middle">llc</text>
  <text x="580" y="38" class="cmd" text-anchor="middle">clang</text>

  <g>
    <rect x="21"  y="52" width="90" height="52" rx="6" fill="#12171b" stroke="#22323a"/>
    <text x="66"  y="74" class="file" text-anchor="middle">Test.c</text>
    <text x="66"  y="92" class="tag" text-anchor="middle">C 소스</text>

    <rect x="168" y="52" width="90" height="52" rx="6" fill="#12171b" stroke="#22323a"/>
    <text x="213" y="74" class="file" text-anchor="middle">Test.ll</text>
    <text x="213" y="92" class="tag" text-anchor="middle">IR</text>

    <rect x="315" y="52" width="90" height="52" rx="6" fill="#12171b" stroke="#22323a"/>
    <text x="360" y="74" class="file" text-anchor="middle">Test.ll'</text>
    <text x="360" y="92" class="tag" text-anchor="middle">최적화된 IR</text>

    <rect x="462" y="52" width="90" height="52" rx="6" fill="#12171b" stroke="#22323a"/>
    <text x="507" y="74" class="file" text-anchor="middle">Test.s</text>
    <text x="507" y="92" class="tag" text-anchor="middle">어셈블리</text>

    <rect x="609" y="52" width="90" height="52" rx="6" fill="#12171b" stroke="#22323a"/>
    <text x="654" y="74" class="file" text-anchor="middle">a.out</text>
    <text x="654" y="92" class="tag" text-anchor="middle">실행 파일</text>
  </g>

  <g stroke="#4d6a76" stroke-width="1.6">
    <line x1="111" y1="78" x2="160" y2="78"/>
    <line x1="258" y1="78" x2="307" y2="78"/>
    <line x1="405" y1="78" x2="454" y2="78"/>
    <line x1="552" y1="78" x2="601" y2="78"/>
  </g>
  <g fill="#4d6a76">
    <path d="M160 73L168 78L160 83Z"/>
    <path d="M307 73L315 78L307 83Z"/>
    <path d="M454 73L462 78L454 83Z"/>
    <path d="M601 73L609 78L601 83Z"/>
  </g>
</svg>
