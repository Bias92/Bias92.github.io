<svg width="720" height="290" viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Ideal pulse train and a real pulse</title>
<desc>Left: an ideal periodic pulse train with the pulse width and the period marked. Right: a real pulse with 10 % and 90 % lines, rise time, fall time, overshoot, ringing and droop.</desc>
<defs>
<filter id="pls-cyan-glow" x="-50%" y="-140%" width="200%" height="380%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide"/><feComponentTransfer in="wide" result="wide-soft"><feFuncA type="linear" slope="0.2"/></feComponentTransfer><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/><feComponentTransfer in="near" result="near-soft"><feFuncA type="linear" slope="0.55"/></feComponentTransfer><feMerge><feMergeNode in="wide-soft"/><feMergeNode in="near-soft"/></feMerge></filter>
<filter id="pls-magenta-glow" x="-50%" y="-140%" width="200%" height="380%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="10" result="wide"/><feComponentTransfer in="wide" result="wide-soft"><feFuncA type="linear" slope="0.2"/></feComponentTransfer><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/><feComponentTransfer in="near" result="near-soft"><feFuncA type="linear" slope="0.55"/></feComponentTransfer><feMerge><feMergeNode in="wide-soft"/><feMergeNode in="near-soft"/></feMerge></filter>
<marker id="pls-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8c949d"/></marker>
</defs>
<rect x="0" y="0" width="720" height="290" rx="12" fill="#0d0e10" stroke="#22323a"/>
<line x1="50" y1="200" x2="345" y2="200" stroke="#8c949d" stroke-width="1" marker-end="url(#pls-arrow)" />
<text x="338" y="218" font-size="12" fill="#8c949d" text-anchor="start" >t</text>
<g filter="url(#pls-cyan-glow)"><polyline fill="none" stroke="#46d9ff" stroke-width="2" stroke-linejoin="round" points="60,200 100,200 100,100 160,100 160,200 220,200 220,100 280,100 280,200 330,200"/>
</g>
<polyline fill="none" stroke="#46d9ff" stroke-width="2" stroke-linejoin="round" points="60,200 100,200 100,100 160,100 160,200 220,200 220,100 280,100 280,200 330,200"/>

<text x="100" y="90" font-size="11" fill="#8c949d" text-anchor="middle" >rising</text>
<text x="160" y="90" font-size="11" fill="#8c949d" text-anchor="middle" >falling</text>
<line x1="100" y1="78" x2="160" y2="78" stroke="#46d9ff" stroke-width="1.2" />
<line x1="100" y1="74" x2="100" y2="82" stroke="#46d9ff" stroke-width="1.2" />
<line x1="160" y1="74" x2="160" y2="82" stroke="#46d9ff" stroke-width="1.2" />
<text x="130.0" y="72" font-size="12" fill="#46d9ff" text-anchor="middle" >t_W</text>
<line x1="100" y1="200" x2="100" y2="236" stroke="#8c949d" stroke-width="1" stroke-dasharray="3 3" />
<line x1="220" y1="200" x2="220" y2="236" stroke="#8c949d" stroke-width="1" stroke-dasharray="3 3" />
<line x1="100" y1="232" x2="220" y2="232" stroke="#8c949d" stroke-width="1.2" />
<line x1="100" y1="228" x2="100" y2="236" stroke="#8c949d" stroke-width="1.2" />
<line x1="220" y1="228" x2="220" y2="236" stroke="#8c949d" stroke-width="1.2" />
<text x="160.0" y="248" font-size="12" fill="#8c949d" text-anchor="middle" >T</text>
<text x="60" y="268" font-size="12" fill="#8c949d" text-anchor="start" >ideal periodic pulses</text>
<line x1="395" y1="200" x2="690" y2="200" stroke="#8c949d" stroke-width="1" marker-end="url(#pls-arrow)" />
<text x="684" y="218" font-size="12" fill="#8c949d" text-anchor="start" >t</text>
<g filter="url(#pls-magenta-glow)"><path d="M400 200 L430 200 C440 200 446 92 470 86 C478 84 483 108 492 102 L556 105 C566 105 572 214 596 212 C604 210 608 195 618 200 L680 200" fill="none" stroke="#ed72d9" stroke-width="2"/></g>
<path d="M400 200 L430 200 C440 200 446 92 470 86 C478 84 483 108 492 102 L556 105 C566 105 572 214 596 212 C604 210 608 195 618 200 L680 200" fill="none" stroke="#ed72d9" stroke-width="2"/>
