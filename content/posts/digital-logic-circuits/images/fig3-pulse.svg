<line x1="540" y1="190" x2="620" y2="190" stroke="#8c949d" stroke-width="1" stroke-dasharray="3 3" />
<line x1="446" y1="232" x2="464" y2="232" stroke="#ed72d9" stroke-width="1.2" />
<line x1="446" y1="228" x2="446" y2="236" stroke="#ed72d9" stroke-width="1.2" />
<line x1="464" y1="228" x2="464" y2="236" stroke="#ed72d9" stroke-width="1.2" />
<text x="455.0" y="248" font-size="12" fill="#ed72d9" text-anchor="middle" >t_r</text>
<line x1="575" y1="232" x2="593" y2="232" stroke="#ed72d9" stroke-width="1.2" />
<line x1="575" y1="228" x2="575" y2="236" stroke="#ed72d9" stroke-width="1.2" />
<line x1="593" y1="228" x2="593" y2="236" stroke="#ed72d9" stroke-width="1.2" />
<text x="584.0" y="248" font-size="12" fill="#ed72d9" text-anchor="middle" >t_f</text>
<text x="470" y="70" font-size="11" fill="#ed72d9" text-anchor="middle" >overshoot</text>
<text x="500" y="140" font-size="11" fill="#8c949d" text-anchor="start" >ringing</text>
<text x="524" y="92" font-size="11" fill="#8c949d" text-anchor="middle" >droop</text>
<text x="400" y="268" font-size="12" fill="#8c949d" text-anchor="start" >real pulse</text>
</svg>
