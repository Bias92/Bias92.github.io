<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Pinned host memory on a discrete PCIe GPU topology</title>
  <desc>Pinned page frames in system DRAM connect through the CPU I/O complex and PCIe to the GPU. The GPU copy engine, SM clusters, PCIe interface, and memory subsystem connect through a logical view of the GPU internal data path.</desc>
  <defs>
    <linearGradient id="cyan-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173a45"/>
      <stop offset="1" stop-color="#31badb"/>
    </linearGradient>
    <linearGradient id="gray-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#242a2f"/>
      <stop offset="1" stop-color="#515b61"/>
    </linearGradient>
    <filter id="cyan-soft" x="-30" y="-30" width="780" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cyan-near" x="-30" y="-30" width="780" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#46d9ff"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#0d0e10"/>

  <!-- Physical containment: host platform, GPU card, and GPU die. -->
  <g fill="none" stroke="#26363d" stroke-width="1.2">
    <rect x="16" y="30" width="278" height="310" rx="2"/>
    <rect x="408" y="30" width="296" height="310" rx="2"/>
    <rect x="424" y="68" width="264" height="228" rx="2"/>
  </g>
  <g fill="#d5d8dc" font-size="15" font-weight="700" letter-spacing="0.7">
    <text x="28" y="53">HOST PLATFORM</text>
    <text x="420" y="53">DISCRETE GPU CARD</text>
  </g>
  <text x="436" y="87" fill="#859198" font-size="10.5" font-weight="700" letter-spacing="0.6">GPU DIE</text>
  <text x="490" y="87" fill="#66737a" font-size="8.5" font-weight="700" letter-spacing="0.55">LOGICAL VIEW</text>

  <!-- Base topology links. -->
  <g fill="none" stroke="#59666c" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter">
    <line x1="616" y1="138" x2="616" y2="164"/>
  </g>

  <!-- Soft bloom follows only the active H2D route and copy-engine client link. -->
  <g fill="none" stroke="#46d9ff" stroke-width="7" opacity="0.12" filter="url(#cyan-soft)" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M132 161H154M132 191H166M132 221H154M154 161V221"/>
    <path d="M278 257H440M482 240V200M604 200V222M604 290V300M464 300H644M464 300V310M524 300V310M584 300V310M644 300V310"/>
    <line x1="492" y1="138" x2="492" y2="164"/>
  </g>

  <!-- Active H2D route. The copy engine is a separate client, not a serial stage. -->
  <g fill="none" stroke="#46d9ff" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M132 161H154M132 191H166M132 221H154M154 161V221"/>
    <line x1="278" y1="257" x2="440" y2="257" marker-end="url(#arrow-cyan)"/>
    <line x1="482" y1="240" x2="482" y2="200"/>
    <line x1="604" y1="200" x2="604" y2="222"/>
    <line x1="604" y1="290" x2="604" y2="300" marker-end="url(#arrow-cyan)"/>
    <path d="M464 300H644M464 300V310M524 300V310M584 300V310M644 300V310"/>
    <line x1="492" y1="138" x2="492" y2="164"/>
  </g>
  <text x="359" y="247" fill="#63ddfb" font-size="12" font-weight="700" text-anchor="middle">PCIe</text>

  <!-- System DRAM and pinned physical page frames. -->
  <rect x="32" y="72" width="112" height="244" rx="2" fill="#12171a" stroke="#405159" stroke-width="1.3"/>
  <text x="88" y="96" fill="#c9d0d4" font-size="11" font-weight="700" text-anchor="middle">SYSTEM DRAM</text>
  <g fill="url(#gray-fill)" stroke="#6e7a80" stroke-width="1">
    <rect x="44" y="108" width="88" height="22" rx="2"/>
    <rect x="44" y="246" width="88" height="22" rx="2"/>
    <rect x="44" y="278" width="88" height="22" rx="2"/>
  </g>
  <text x="88" y="143" fill="#63ddfb" font-size="9.5" font-weight="700" letter-spacing="0.45" text-anchor="middle">PINNED FRAMES</text>
  <g fill="#46d9ff" opacity="0.14" filter="url(#cyan-soft)">
    <rect x="44" y="150" width="88" height="22" rx="2"/>
    <rect x="44" y="180" width="88" height="22" rx="2"/>
    <rect x="44" y="210" width="88" height="22" rx="2"/>
  </g>
  <g fill="none" stroke="#79e5ff" stroke-width="2.4" opacity="0.62" filter="url(#cyan-near)">
    <rect x="44" y="150" width="88" height="22" rx="2"/>
    <rect x="44" y="180" width="88" height="22" rx="2"/>
    <rect x="44" y="210" width="88" height="22" rx="2"/>
  </g>
  <g fill="url(#cyan-fill)" stroke="#46d9ff" stroke-width="1.2">
    <rect x="44" y="150" width="88" height="22" rx="2"/>
    <rect x="44" y="180" width="88" height="22" rx="2"/>
    <rect x="44" y="210" width="88" height="22" rx="2"/>
  </g>

  <!-- The host I/O block intentionally hides platform-specific internal wiring. -->
  <rect x="166" y="118" width="112" height="158" rx="2" fill="#15242a" stroke="#46bcd8" stroke-width="1.2"/>
  <g fill="#cbd3d7" font-weight="700" text-anchor="middle">
    <text x="222" y="145" font-size="11">CPU / I/O</text>
    <text x="222" y="160" font-size="11">COMPLEX</text>
    <line x1="180" y1="174" x2="264" y2="174" stroke="#3e727e" stroke-width="1"/>
    <text x="222" y="202" font-size="9.2">MEMORY CONTROLLER</text>
    <text x="222" y="244" font-size="9.2">PCIe ROOT COMPLEX</text>
  </g>

  <!-- GPU clients, fabric, I/O, and memory hierarchy. -->
  <g fill="#46d9ff" opacity="0.13" filter="url(#cyan-soft)">
    <rect x="440" y="98" width="104" height="40" rx="2"/>
  </g>
  <g fill="none" stroke="#79e5ff" stroke-width="2.5" opacity="0.6" filter="url(#cyan-near)">
    <rect x="440" y="98" width="104" height="40" rx="2"/>
  </g>
  <rect x="440" y="98" width="104" height="40" rx="2" fill="url(#cyan-fill)" stroke="#46d9ff" stroke-width="1.3"/>
  <rect x="560" y="98" width="112" height="40" rx="2" fill="#20272b" stroke="#59666c" stroke-width="1.2"/>
  <g fill="#eef4f6" font-weight="700" text-anchor="middle">
    <text x="492" y="115" font-size="10.5">COPY ENGINE</text>
    <text x="492" y="130" font-size="10">DMA</text>
    <text x="616" y="122" font-size="10.5">SM CLUSTERS</text>
  </g>

  <rect x="440" y="164" width="232" height="36" rx="2" fill="#15242a" stroke="#46bcd8" stroke-width="1.3"/>
  <text x="556" y="187" fill="#dceff3" font-size="10.5" font-weight="700" text-anchor="middle">GPU INTERNAL DATA PATH</text>

  <rect x="440" y="240" width="84" height="36" rx="2" fill="#15242a" stroke="#46bcd8" stroke-width="1.2"/>
  <g fill="#cbd3d7" font-size="10.5" font-weight="650" text-anchor="middle">
    <text x="482" y="255">GPU PCIe</text>
    <text x="482" y="269">I/O</text>
  </g>

  <rect x="536" y="222" width="136" height="68" rx="2" fill="#15242a" stroke="#46bcd8" stroke-width="1.2"/>
  <g fill="#dceff3" font-weight="700" text-anchor="middle">
    <text x="604" y="241" font-size="10.5">GPU MEMORY</text>
    <text x="604" y="255" font-size="10.5">SUBSYSTEM</text>
    <line x1="550" y1="262" x2="658" y2="262" stroke="#3e727e" stroke-width="1"/>
    <text x="604" y="275" font-size="9.5">L2 + MEMORY</text>
    <text x="604" y="286" font-size="9.5">CONTROLLERS</text>
  </g>

  <!-- Four independent GDDR6 packages sit on the card outside the GPU die. -->
  <g fill="#12323b" stroke="#46bcd8" stroke-width="1.2">
    <rect x="440" y="310" width="48" height="24" rx="2"/>
    <rect x="500" y="310" width="48" height="24" rx="2"/>
    <rect x="560" y="310" width="48" height="24" rx="2"/>
    <rect x="620" y="310" width="48" height="24" rx="2"/>
  </g>
  <g fill="#dceff3" font-size="8.5" font-weight="700" text-anchor="middle">
    <text x="464" y="326">GDDR6</text>
    <text x="524" y="326">GDDR6</text>
    <text x="584" y="326">GDDR6</text>
    <text x="644" y="326">GDDR6</text>
  </g>
</svg>
