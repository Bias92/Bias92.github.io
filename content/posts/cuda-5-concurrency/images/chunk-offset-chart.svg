<svg width="720" height="206" viewBox="0 0 720 206" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Chunk ranges of one device array selected by offset</title>
  <desc>One device array allocated at the full size is divided into four chunk ranges, and offset is the element index at which each chunk begins.</desc>
  <defs>
    <linearGradient id="co-fill" x1="0" x2="1"><stop offset="0" stop-color="#173a45"/><stop offset="1" stop-color="#31badb"/></linearGradient>
    <filter id="co-wide" x="-60" y="-60" width="840" height="326" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="co-near" x="-60" y="-60" width="840" height="326" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="co-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#8c949d"/></marker>
  </defs>

  <rect width="720" height="206" fill="#0d0e10"/>

  <text x="28" y="38" fill="#d5d8dc" font-size="15" font-weight="650" letter-spacing="0.7">DEVICE ARRAY d_x</text>
  <text x="692" y="38" fill="#8c949d" font-size="13" font-weight="600" text-anchor="end">N = 16,777,216</text>

  <g fill="#46d9ff" opacity="0.16" filter="url(#co-wide)">
    <rect x="104" y="58" width="144" height="42" rx="10"/><rect x="252" y="58" width="144" height="42" rx="10"/>
    <rect x="400" y="58" width="144" height="42" rx="10"/><rect x="548" y="58" width="144" height="42" rx="10"/>
  </g>
  <g fill="none" stroke="#46d9ff" stroke-width="3" opacity="0.8" filter="url(#co-near)">
    <rect x="104" y="58" width="144" height="42" rx="10"/><rect x="252" y="58" width="144" height="42" rx="10"/>
    <rect x="400" y="58" width="144" height="42" rx="10"/><rect x="548" y="58" width="144" height="42" rx="10"/>
  </g>
  <g fill="url(#co-fill)" stroke="#46d9ff" stroke-width="1.4">
    <rect x="104" y="58" width="144" height="42" rx="10"/><rect x="252" y="58" width="144" height="42" rx="10"/>
    <rect x="400" y="58" width="144" height="42" rx="10"/><rect x="548" y="58" width="144" height="42" rx="10"/>
  </g>
  <g fill="#edf4f7" font-size="14" font-weight="650" text-anchor="middle">
    <text x="176" y="85">CHUNK 0</text><text x="324" y="85">CHUNK 1</text>
    <text x="472" y="85">CHUNK 2</text><text x="620" y="85">CHUNK 3</text>
  </g>

  <g stroke="#455159" stroke-width="1.3" marker-end="url(#co-arrow)">
    <line x1="104" y1="124" x2="104" y2="108"/><line x1="252" y1="124" x2="252" y2="108"/>
    <line x1="400" y1="124" x2="400" y2="108"/><line x1="548" y1="124" x2="548" y2="108"/>
  </g>

  <text x="28" y="148" fill="#8c949d" font-size="13" font-weight="600">offset</text>
  <g fill="#d5d8dc" font-size="13" font-weight="650" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="104" y="148">0</text><text x="252" y="148">1048576</text>
    <text x="400" y="148">2097152</text><text x="548" y="148">3145728</text>
  </g>

  <text x="28" y="180" fill="#8c949d" font-size="13" font-weight="600">start</text>
  <g fill="#9fdcec" font-size="13" font-weight="650" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="104" y="180">d_x + 0</text><text x="252" y="180">d_x + 1048576</text>
    <text x="400" y="180">d_x + 2097152</text><text x="548" y="180">d_x + 3145728</text>
  </g>
</svg>
