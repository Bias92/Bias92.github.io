<svg width="720" height="320" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Pinned host memory and asynchronous GPU copy</title>
  <desc>A host pointer maps to physical RAM pages which remain resident. A GPU copy engine can access those stable pages independently of the CPU thread.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#33c0e4"/>
    </marker>
  </defs>

  <rect width="720" height="320" rx="12" fill="#0d0e10" stroke="#22323a"/>
  <text x="28" y="34" font-size="16" font-weight="700" fill="#9fdcec">Pinned host memory</text>
  <text x="692" y="34" font-size="12" text-anchor="end" fill="#8fb2bd">physical pages stay resident</text>

  <rect x="28" y="58" width="174" height="238" rx="10" fill="#0f1319" stroke="#22323a"/>
  <text x="115" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#9fdcec">Host pointer</text>
  <rect x="54" y="110" width="122" height="48" rx="7" fill="#10333d" stroke="#33c0e4"/>
  <text x="115" y="139" font-size="14" text-anchor="middle" fill="#e6f6fb">h_buffer</text>
  <text x="115" y="188" font-size="12" text-anchor="middle" fill="#8fb2bd">virtual pages</text>
  <g fill="#15242a" stroke="#3f7f90">
    <rect x="50" y="204" width="38" height="38" rx="5"/>
    <rect x="96" y="204" width="38" height="38" rx="5"/>
    <rect x="142" y="204" width="38" height="38" rx="5"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#9fdcec">
    <text x="69" y="228">P0</text><text x="115" y="228">P1</text><text x="161" y="228">P2</text>
  </g>
  <text x="115" y="274" font-size="11.5" text-anchor="middle" fill="#8fb2bd">cudaHostAlloc</text>

  <line x1="204" y1="224" x2="246" y2="224" stroke="#33c0e4" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="258" y="58" width="204" height="238" rx="10" fill="#0f1319" stroke="#22323a"/>
  <text x="360" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#9fdcec">Physical RAM</text>
  <g fill="#10333d" stroke="#33c0e4" stroke-width="1.4">
    <rect x="286" y="119" width="148" height="42" rx="6"/>
    <rect x="286" y="171" width="148" height="42" rx="6"/>
    <rect x="286" y="223" width="148" height="42" rx="6"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#e6f6fb">
    <text x="360" y="145">page P0</text>
    <text x="360" y="197">page P1</text>
    <text x="360" y="249">page P2</text>
  </g>
  <path d="M274 110H264V275H274" fill="none" stroke="#e46fd6" stroke-width="2"/>
  <text x="252" y="194" font-size="11.5" text-anchor="end" fill="#e46fd6" transform="rotate(-90 252 194)">pinned</text>

  <line x1="464" y1="177" x2="510" y2="177" stroke="#33c0e4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="487" y="158" font-size="11.5" text-anchor="middle" fill="#8fb2bd">async copy</text>

  <rect x="522" y="58" width="170" height="238" rx="10" fill="#0f1319" stroke="#22323a"/>
  <text x="607" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#9fdcec">GPU</text>
  <rect x="548" y="119" width="118" height="146" rx="8" fill="#2b1229" stroke="#e46fd6"/>
  <text x="607" y="198" font-size="14" text-anchor="middle" fill="#f1caeb">Copy engine</text>

</svg>
