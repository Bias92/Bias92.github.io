<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Three Unified Memory paths on the same access timeline</title>
  <desc>The same CPU write, GPU kernel, synchronization, and CPU read sequence shown as three horizontal lanes: full Unified Memory with separate physical memories, limited Unified Memory with separate physical memories, and shared physical DRAM with cache coherence.</desc>
  <style>
    text { font-family: 'Roboto', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
  <defs>
    <filter id="tm-glow" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tm-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#465158" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#93a3aa" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="tm-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c6f88" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#40cdef" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="tm-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#40cdef"/>
    </marker>
    <marker id="tm-arrow-steel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#93a3aa"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#0d0e10"/>

  <!-- one clock shared by all three paths -->
  <g fill="#7f858c" font-size="10.5" text-anchor="middle" letter-spacing="0.45">
    <text x="228" y="25">CPU WRITE</text>
    <text x="392" y="25">KERNEL</text>
    <text x="528" y="25">SYNC</text>
    <text x="652" y="25">CPU READ</text>
  </g>
  <line x1="188" y1="45" x2="684" y2="45" stroke="#465158" stroke-width="1.2" marker-end="url(#tm-arrow-steel)"/>
  <g fill="#0d0e10" stroke="#5fcbe8" stroke-width="1.4">
    <circle cx="228" cy="45" r="4"/>
    <circle cx="392" cy="45" r="4"/>
    <circle cx="528" cy="45" r="4"/>
    <circle cx="652" cy="45" r="4"/>
  </g>
  <g stroke="#191d21" stroke-width="1">
    <line x1="228" y1="54" x2="228" y2="412"/>
    <line x1="392" y1="54" x2="392" y2="412"/>
    <line x1="528" y1="54" x2="528" y2="412"/>
    <line x1="652" y1="54" x2="652" y2="412"/>
  </g>

  <!-- full model, separate physical memories -->
  <g>
    <text x="26" y="91" fill="#d9e1e4" font-size="12.5" font-weight="700">FULL · SEPARATE</text>
    <text x="26" y="109" fill="#70777d" font-size="10.5">one possible software-migration path</text>

    <line x1="202" y1="137" x2="346" y2="137" stroke="url(#tm-steel)" stroke-width="10" stroke-linecap="round"/>
    <text x="274" y="160" fill="#9aa5aa" font-size="10.5" text-anchor="middle">CPU-resident page</text>

    <circle cx="392" cy="137" r="13" fill="#10242b" stroke="#40cdef" stroke-width="1.7" filter="url(#tm-glow)"/>
    <path d="M387 137h10M392 132v10" stroke="#7fe0f7" stroke-width="1.4"/>
    <text x="392" y="116" fill="#5fcbe8" font-size="10" text-anchor="middle">GPU fault</text>

    <line x1="408" y1="137" x2="448" y2="137" stroke="#40cdef" stroke-width="2" marker-end="url(#tm-arrow-cyan)" filter="url(#tm-glow)"/>
    <text x="428" y="126" fill="#7f858c" font-size="9.5" text-anchor="middle">copy / map</text>
    <line x1="450" y1="137" x2="562" y2="137" stroke="url(#tm-cyan)" stroke-width="10" stroke-linecap="round"/>
    <text x="506" y="160" fill="#7fe0f7" font-size="10.5" text-anchor="middle">GPU-resident page</text>

    <path d="M568 137C600 137 621 137 644 137" fill="none" stroke="#93a3aa" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#tm-arrow-steel)"/>
    <text x="608" y="126" fill="#70777d" font-size="9.5" text-anchor="middle">may fault back</text>
  </g>

  <line x1="26" y1="183" x2="690" y2="183" stroke="#20262a"/>

  <!-- limited model, separate physical memories -->
  <g>
    <text x="26" y="214" fill="#d9e1e4" font-size="12.5" font-weight="700">LIMITED · SEPARATE</text>
    <text x="26" y="232" fill="#70777d" font-size="10.5">launch and sync delimit access epochs</text>

    <line x1="202" y1="263" x2="382" y2="263" stroke="url(#tm-steel)" stroke-width="10" stroke-linecap="round"/>
    <line x1="402" y1="263" x2="518" y2="263" stroke="url(#tm-cyan)" stroke-width="10" stroke-linecap="round"/>
    <line x1="538" y1="263" x2="684" y2="263" stroke="url(#tm-steel)" stroke-width="10" stroke-linecap="round"/>

    <g stroke="#40cdef" fill="#0d0e10" filter="url(#tm-glow)">
      <path d="M386 254L392 263L398 254" stroke-width="1.6"/>
      <path d="M522 254L528 263L534 254" stroke-width="1.6"/>
    </g>
    <text x="292" y="286" fill="#9aa5aa" font-size="10.5" text-anchor="middle">CPU-access epoch</text>
    <text x="460" y="286" fill="#7fe0f7" font-size="10.5" text-anchor="middle">GPU-exclusive epoch</text>
    <text x="611" y="286" fill="#9aa5aa" font-size="10.5" text-anchor="middle">CPU-access epoch</text>
    <text x="392" y="247" fill="#5fcbe8" font-size="9.5" text-anchor="middle">placement</text>
    <text x="528" y="247" fill="#5fcbe8" font-size="9.5" text-anchor="middle">release</text>
  </g>

  <line x1="26" y1="309" x2="690" y2="309" stroke="#20262a"/>

  <!-- shared physical DRAM -->
  <g>
    <text x="26" y="340" fill="#d9e1e4" font-size="12.5" font-weight="700">SHARED PHYSICAL DRAM</text>
    <text x="26" y="358" fill="#70777d" font-size="10.5">the page stays; cache state crosses the boundary</text>

    <line x1="202" y1="382" x2="684" y2="382" stroke="#4f5a60" stroke-width="10" stroke-linecap="round"/>
    <line x1="202" y1="382" x2="684" y2="382" stroke="url(#tm-steel)" stroke-width="2" stroke-linecap="round"/>
    <text x="443" y="404" fill="#9aa5aa" font-size="10.5" text-anchor="middle">same physical DRAM page</text>

    <line x1="202" y1="368" x2="352" y2="368" stroke="#93a3aa" stroke-width="3" stroke-linecap="round"/>
    <line x1="407" y1="368" x2="513" y2="368" stroke="#40cdef" stroke-width="3" stroke-linecap="round" filter="url(#tm-glow)"/>
    <line x1="548" y1="368" x2="684" y2="368" stroke="#93a3aa" stroke-width="3" stroke-linecap="round"/>
    <text x="277" y="363" fill="#7f858c" font-size="9.5" text-anchor="middle">CPU cache</text>
    <text x="460" y="363" fill="#5fcbe8" font-size="9.5" text-anchor="middle">GPU cache</text>
    <text x="616" y="363" fill="#7f858c" font-size="9.5" text-anchor="middle">CPU cache</text>

    <g stroke="#40cdef" stroke-width="1.7" fill="#0d0e10" filter="url(#tm-glow)">
      <path d="M392 358v33"/>
      <path d="M528 358v33"/>
      <path d="M387 382l5-5l5 5l-5 5Z" fill="#153843"/>
      <path d="M523 382l5-5l5 5l-5 5Z" fill="#153843"/>
    </g>
    <text x="392" y="417" fill="#5fcbe8" font-size="9.5" text-anchor="middle">clean / invalidate</text>
    <text x="528" y="417" fill="#5fcbe8" font-size="9.5" text-anchor="middle">clean / invalidate</text>
  </g>
</svg>
