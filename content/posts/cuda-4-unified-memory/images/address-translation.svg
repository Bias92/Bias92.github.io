<svg width="560" height="710" viewBox="0 0 560 710" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Virtual address translation through an MMU, TLB, and page table</title>
  <desc>A CPU or GPU memory access presents a virtual page number and page offset to an MMU. The MMU checks a TLB and, on a TLB miss, walks a page table. A valid translation produces a physical page number with the same offset. A missing or disallowed mapping can raise a page fault.</desc>
  <style>
    text { font-family: 'Roboto', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; }
    .actor { fill: #d7e2e6; font-size: 24px; font-weight: 700; }
    .label { fill: #d7e2e6; font-size: 20px; }
    .accent { fill: #7fe0f7; font-size: 20px; font-weight: 700; }
    .note { fill: #a6b0b5; font-size: 20px; }
  </style>
  <defs>
    <marker id="cyan-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4fc9e8"/>
    </marker>
    <marker id="steel-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#66747a"/>
    </marker>
  </defs>

  <rect width="560" height="710" fill="#0d0e10"/>

  <rect x="70" y="20" width="420" height="64" rx="4" fill="#11171a" stroke="#52636b" stroke-width="1.5"/>
  <text x="280" y="60" text-anchor="middle" class="actor">CPU or GPU load / store</text>

  <line x1="280" y1="84" x2="280" y2="111" stroke="#4fc9e8" stroke-width="2" marker-end="url(#cyan-arrow)"/>

  <rect x="35" y="120" width="490" height="76" rx="4" fill="#15242a" stroke="#4fc9e8" stroke-width="1.5"/>
  <line x1="380" y1="120" x2="380" y2="196" stroke="#52636b" stroke-width="1.5"/>
  <text x="207" y="166" text-anchor="middle" class="actor">virtual page number</text>
  <text x="452" y="154" text-anchor="middle" class="label">page</text>
  <text x="452" y="178" text-anchor="middle" class="label">offset</text>

  <line x1="280" y1="196" x2="280" y2="221" stroke="#4fc9e8" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="298" y="219" class="note">virtual address</text>

  <rect x="170" y="230" width="220" height="70" rx="4" fill="#11171a" stroke="#52636b" stroke-width="1.5"/>
  <text x="280" y="274" text-anchor="middle" class="actor">MMU</text>

  <path d="M235 300 V326 H140 V351" fill="none" stroke="#4fc9e8" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="154" y="318" class="accent">lookup</text>

  <rect x="35" y="360" width="210" height="82" rx="4" fill="#11171a" stroke="#52636b" stroke-width="1.5"/>
  <text x="140" y="394" text-anchor="middle" class="actor">TLB</text>
  <text x="140" y="421" text-anchor="middle" class="note">translation cache</text>

  <rect x="315" y="360" width="210" height="82" rx="4" fill="#11171a" stroke="#52636b" stroke-width="1.5"/>
  <text x="420" y="394" text-anchor="middle" class="actor">Page table</text>
  <text x="420" y="421" text-anchor="middle" class="note">page-table entry</text>

  <line x1="245" y1="401" x2="313" y2="401" stroke="#4fc9e8" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#cyan-arrow)"/>
  <text x="280" y="389" text-anchor="middle" class="accent">miss</text>

  <path d="M140 442 V486" fill="none" stroke="#4fc9e8" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="100" y="472" class="accent">hit</text>

  <path d="M390 442 V466 H255 V486" fill="none" stroke="#4fc9e8" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="320" y="459" text-anchor="middle" class="accent">valid entry</text>

  <path d="M475 442 V486" fill="none" stroke="#66747a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#steel-arrow)"/>
  <text x="468" y="472" text-anchor="middle" class="note">not present</text>

  <rect x="35" y="495" width="300" height="76" rx="4" fill="#15242a" stroke="#4fc9e8" stroke-width="1.5"/>
  <line x1="220" y1="495" x2="220" y2="571" stroke="#52636b" stroke-width="1.5"/>
  <text x="127" y="529" text-anchor="middle" class="actor">physical page</text>
  <text x="127" y="554" text-anchor="middle" class="actor">number</text>
  <text x="277" y="529" text-anchor="middle" class="label">same page</text>
  <text x="277" y="553" text-anchor="middle" class="label">offset</text>

  <rect x="365" y="495" width="160" height="76" rx="4" fill="#11171a" stroke="#66747a" stroke-width="1.5"/>
  <text x="445" y="529" text-anchor="middle" class="actor">page fault</text>
  <text x="445" y="554" text-anchor="middle" class="note">handled / error</text>

  <line x1="185" y1="571" x2="185" y2="616" stroke="#4fc9e8" stroke-width="2" marker-end="url(#cyan-arrow)"/>
  <text x="203" y="605" class="note">memory hierarchy</text>

  <rect x="35" y="625" width="490" height="70" rx="4" fill="#11171a" stroke="#52636b" stroke-width="1.5"/>
  <text x="280" y="655" text-anchor="middle" class="actor">physical backing page</text>
  <text x="280" y="681" text-anchor="middle" class="note">CPU DRAM · GPU VRAM · shared SoC DRAM</text>
</svg>
