<svg width="1120" height="701" viewBox="0 0 1120 701" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CPU virtual-to-physical address translation</title>
  <desc>A recolored version of the reference layout. A CPU sends a virtual address to an MMU, the MMU exchanges translations with a TLB, and a physical address reaches physical memory through a bus.</desc>
  <style>
    text { font-family: 'Roboto', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; }
    .main { fill: #d7e2e6; font-size: 32px; }
    .label { fill: #d7e2e6; font-size: 30px; }
    .legend { fill: #d7e2e6; font-size: 29px; }
  </style>

  <rect width="1120" height="701" fill="#0d0e10"/>

  <rect x="6" y="6" width="431" height="393" fill="#0d0e10" stroke="#66747a" stroke-width="6"/>

  <rect x="225" y="20" width="199" height="139" fill="#4fc9e8" stroke="#66747a" stroke-width="6"/>
  <text x="324.5" y="102" text-anchor="middle" fill="#0d0e10" font-size="32">CPU</text>

  <text x="492" y="51" text-anchor="middle" class="main">CPU</text>
  <text x="492" y="93" text-anchor="middle" class="main">casing</text>

  <line x1="324" y1="159" x2="324" y2="239" stroke="#4fc9e8" stroke-width="4"/>
  <path d="M313 225 L324 241 L335 225" fill="none" stroke="#4fc9e8" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="82" y="211" class="label">virtual address</text>

  <rect x="225" y="245" width="199" height="140" fill="#15242a" stroke="#4fc9e8" stroke-width="6"/>
  <text x="324.5" y="326" text-anchor="middle" class="main">MMU</text>

  <rect x="21" y="292" width="139" height="49" fill="#15242a" stroke="#4fc9e8" stroke-width="6"/>
  <text x="90.5" y="327" text-anchor="middle" class="main">TLB</text>

  <line x1="225" y1="309" x2="162" y2="309" stroke="#4fc9e8" stroke-width="4"/>
  <path d="M178 299 L162 309 L178 319" fill="none" stroke="#4fc9e8" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  <line x1="160" y1="331" x2="223" y2="331" stroke="#4fc9e8" stroke-width="4"/>
  <path d="M207 321 L223 331 L207 341" fill="none" stroke="#4fc9e8" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>

  <rect x="684" y="6" width="431" height="393" fill="#11171a" stroke="#66747a" stroke-width="6"/>
  <rect x="687" y="9" width="425" height="61" fill="#344249"/>
  <line x1="684" y1="70" x2="1115" y2="70" stroke="#66747a" stroke-width="6"/>
  <text x="899.5" y="50" text-anchor="middle" class="main">physical memory</text>
  <text x="899.5" y="103" text-anchor="middle" class="label">physical address #1</text>
  <text x="899.5" y="147" text-anchor="middle" class="label">physical address #2</text>
  <text x="899.5" y="191" text-anchor="middle" class="label">physical address #3</text>
  <text x="899.5" y="237" text-anchor="middle" class="main">.</text>
  <text x="899.5" y="281" text-anchor="middle" class="main">.</text>
  <text x="899.5" y="325" text-anchor="middle" class="main">.</text>
  <text x="899.5" y="369" text-anchor="middle" class="main">.</text>

  <line x1="324" y1="385" x2="324" y2="520" stroke="#4fc9e8" stroke-width="4"/>
  <path d="M313 506 L324 522 L335 506" fill="none" stroke="#4fc9e8" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="346" y="469" class="label">physical address</text>

  <text x="14" y="539" class="label">bus</text>
  <line x1="88" y1="529" x2="1115" y2="529" stroke="#66747a" stroke-width="5"/>

  <line x1="891" y1="529" x2="891" y2="402" stroke="#4fc9e8" stroke-width="4"/>
  <path d="M880 416 L891 400 L902 416" fill="none" stroke="#4fc9e8" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>

  <text x="28" y="611" class="legend">CPU: Central processing unit</text>
  <text x="28" y="654" class="legend">MMU: Memory management unit</text>
  <text x="28" y="692" class="legend">TLB: Translation lookaside buffer</text>
</svg>
