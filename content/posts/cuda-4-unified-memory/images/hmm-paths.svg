<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Two ways a plain malloc pointer becomes reachable from the GPU</title>
  <desc>Both halves start from the same system allocation. When pageableMemoryAccessUsesHostPageTables is 0, the driver mirrors the CPU page table into a separate GPU page table and resolves GPU faults by migrating pages: software coherence, HMM. When it is 1, the GPU walks the host page table itself, so no mirroring and no migration are needed: hardware coherence, ATS.</desc>
  <style>
    text{font-family:'Roboto','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;fill:#cfe9f2}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .hdr{font-size:10.5px;fill:#dff0f7}
    .sub{font-size:9.5px;fill:#8fb0bd}
    .box{font-size:9.5px;fill:#dff0f7}
    .note{font-size:9px;fill:#6f8b96}
  </style>

  <rect width="720" height="300" fill="#0d0e10"/>

  <!-- shared starting point -->
  <rect x="200" y="18" width="320" height="28" rx="5" fill="#0f2b34" stroke="#2f7f95"/>
  <text x="360" y="36" class="mono box" text-anchor="middle">int *x = malloc(sizeof(*x));</text>
  <line x1="360" y1="46" x2="180" y2="70" stroke="#2b3a42"/>
  <line x1="360" y1="46" x2="540" y2="70" stroke="#2b3a42"/>

  <line x1="360" y1="76" x2="360" y2="284" stroke="#22323a"/>

  <!-- ===== LEFT: HMM ===== -->
  <text x="30" y="90" class="mono hdr">usesHostPageTables == 0</text>
  <text x="30" y="105" class="sub">HMM · software coherence</text>

  <rect x="30" y="122" width="130" height="34" rx="5" fill="#12171b" stroke="#22323a"/>
  <text x="95" y="143" class="box" text-anchor="middle">CPU page table</text>
  <rect x="200" y="122" width="130" height="34" rx="5" fill="#12171b" stroke="#22323a"/>
  <text x="265" y="143" class="box" text-anchor="middle">GPU page table</text>

  <line x1="162" y1="139" x2="192" y2="139" stroke="#e46fd6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M200 139L190 134V144Z" fill="#e46fd6"/>
  <text x="181" y="130" class="note" text-anchor="middle">mirror</text>

  <rect x="30" y="186" width="300" height="30" rx="5" fill="#0a1216" stroke="#2b3a42" stroke-dasharray="4 4"/>
  <text x="180" y="205" class="box" text-anchor="middle">GPU fault → page migration</text>

  <text x="30" y="242" class="note">페이지 테이블 2개 · 드라이버가 동기화</text>

  <!-- ===== RIGHT: ATS ===== -->
  <text x="390" y="90" class="mono hdr">usesHostPageTables == 1</text>
  <text x="390" y="105" class="sub">ATS · hardware coherence</text>

  <rect x="450" y="122" width="180" height="34" rx="5" fill="#12171b" stroke="#2f7f95"/>
  <text x="540" y="143" class="box" text-anchor="middle">host page table</text>

  <rect x="390" y="186" width="80" height="28" rx="5" fill="#0f2b34" stroke="#2f7f95"/>
  <text x="430" y="204" class="mono" font-size="9.5" fill="#9fdcec" text-anchor="middle">CPU</text>
  <rect x="610" y="186" width="80" height="28" rx="5" fill="#0f2b34" stroke="#2f7f95"/>
  <text x="650" y="204" class="mono" font-size="9.5" fill="#9fdcec" text-anchor="middle">GPU</text>

  <line x1="440" y1="184" x2="480" y2="160" stroke="#40cdef" stroke-width="1.4"/>
  <path d="M486 156L474 158L480 167Z" fill="#40cdef"/>
  <line x1="640" y1="184" x2="600" y2="160" stroke="#40cdef" stroke-width="1.4"/>
  <path d="M594 156L600 167L606 158Z" fill="#40cdef"/>

  <text x="390" y="242" class="note">페이지 테이블 1개 · 미러링·migration 불필요</text>
</svg>
